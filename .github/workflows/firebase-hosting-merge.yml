name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  verification:
    uses: ./.github/workflows/local-verification.yml
  build_and_deploy:
    needs: verification
    permissions:
      contents: read
      checks: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
      - name: Select reviewed publication scope
        id: scope
        env:
          BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/selectProviderHostingScope.cjs "$BEFORE"
      - uses: actions/cache@v4
        with:
          path: .hosting-static-history
          key: firebase-next-static-live-${{ github.sha }}
          restore-keys: |
            firebase-next-static-live-
      - run: npm run hosting:bootstrap
        if: steps.scope.outputs.scope == 'full'
      - run: |
          if [ -z "$NEXT_PUBLIC_GOOGLE_MAPS_API_KEY" ]; then
            echo "NEXT_PUBLIC_GOOGLE_MAPS_API_KEY GitHub secret is required for the static export build."
            exit 1
          fi
          npm ci
          node --test scripts/prepareProviderPanelHosting.test.cjs scripts/selectProviderHostingScope.test.cjs
          npm run build
        env:
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
      - name: Preserve the current site and replace only the selected page
        if: steps.scope.outputs.scope != 'full'
        run: node scripts/prepareProviderPanelHosting.cjs prepare "$PUBLICATION_SCOPE"
        env:
          PUBLICATION_SCOPE: ${{ steps.scope.outputs.scope }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RESERVAELDIA_7A440 }}
      - name: Check that the preserved release is still current
        if: steps.scope.outputs.scope != 'full'
        run: node scripts/prepareProviderPanelHosting.cjs assert-current "$PUBLICATION_SCOPE"
        env:
          PUBLICATION_SCOPE: ${{ steps.scope.outputs.scope }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RESERVAELDIA_7A440 }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RESERVAELDIA_7A440 }}
          channelId: live
          projectId: reservaeldia-7a440
      - run: npm run verify:hosting:production
      - name: Verify selected page and preserved file hashes
        if: steps.scope.outputs.scope != 'full'
        run: node scripts/prepareProviderPanelHosting.cjs verify "$PUBLICATION_SCOPE"
        env:
          PUBLICATION_SCOPE: ${{ steps.scope.outputs.scope }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RESERVAELDIA_7A440 }}
      - name: Preserve scoped publication evidence
        if: always() && (steps.scope.outputs.scope == 'panel' || steps.scope.outputs.scope == 'venues')
        uses: actions/upload-artifact@v4
        with:
          name: scoped-hosting-${{ steps.scope.outputs.scope }}-${{ github.run_id }}
          path: |
            .local-isolation/provider-panel-hosting*.json
            .local-isolation/venues-hosting*.json
          include-hidden-files: true
          retention-days: 14
