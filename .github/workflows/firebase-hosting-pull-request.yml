name: Deploy to Firebase Hosting on PR
on: pull_request
concurrency:
  group: firebase-hosting-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  verification:
    uses: ./.github/workflows/local-verification.yml
  build_and_preview:
    needs: verification
    permissions:
      checks: write
      contents: read
      pull-requests: write
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
      - uses: actions/cache@v4
        with:
          path: .hosting-static-history
          key: firebase-next-static-pr-${{ github.event.pull_request.number }}-${{ github.sha }}
          restore-keys: |
            firebase-next-static-pr-${{ github.event.pull_request.number }}-
      - run: |
          if [ -z "$NEXT_PUBLIC_GOOGLE_MAPS_API_KEY" ]; then
            echo "NEXT_PUBLIC_GOOGLE_MAPS_API_KEY GitHub secret is required for the static export build."
            exit 1
          fi
          npm ci
          node --test scripts/prepareProviderPanelHosting.test.cjs
          npm run build
        env:
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
      # Exercise this release's preservation against the actual live inventory
      # before merging. This reads live Hosting; deployment remains a PR preview.
      - name: Validate provider panel preservation before integration
        if: github.head_ref == 'feat/proveedores-panel-compacto'
        run: node scripts/prepareProviderPanelHosting.cjs prepare
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RESERVAELDIA_7A440 }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RESERVAELDIA_7A440 }}
          projectId: reservaeldia-7a440
      - name: Preserve provider panel preparation evidence
        if: always() && github.head_ref == 'feat/proveedores-panel-compacto'
        uses: actions/upload-artifact@v4
        with:
          name: provider-panel-preview-${{ github.run_id }}
          path: .local-isolation/provider-panel-hosting.json
          include-hidden-files: true
          retention-days: 14
